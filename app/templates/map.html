<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Actividad vial</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <style>
    html, body { margin: 0; font-family: system-ui, sans-serif; background: #f6f7f9; color: #111827; }
    header { padding: 14px 16px; background: white; border-bottom: 1px solid #e5e7eb; }
    header h1 { margin: 0 0 4px; font-size: 18px; }
    header p { margin: 0; color: #6b7280; font-size: 13px; }
    .toolbar { padding: 10px 16px; background: white; border-bottom: 1px solid #e5e7eb; display: flex; gap: 8px; }
    .toolbar button { flex: 1; border: 0; border-radius: 10px; padding: 10px; font-weight: 700; cursor: pointer; }
    .toolbar button.active { outline: 2px solid #111827; }
    #map { height: 68vh; min-height: 420px; }
    .legend { padding: 12px 16px; font-size: 13px; line-height: 1.7; }
    .emoji-marker {
      background: white;
      border: 2px solid #111827;
      border-radius: 50%;
      width: 34px !important;
      height: 34px !important;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,.22);
    }
  </style>
</head>
<body>
<header>
  <h1>Actividad vial</h1>
  <p id="scopeText">Mostrando incidentes dentro de {{ radius_km }} km.</p>
</header>

<div class="toolbar">
  <button id="homeBtn">🏠 Inicio</button>
  <button id="nearbyBtn" class="active">📍 Cerca de mí</button>
  <button id="allBtn">🌐 Ver todos</button>
</div>

<div id="map"></div>

<div class="legend">
  🚗 Accidente · ⛔ Vía cerrada · 🌊 Inundación · 🚦 Semáforo dañado ·
  🚧 Obras · 🐢 Congestión · 🚨
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
  const userLat = {{ lat }};
  const userLng = {{ lng }};
  const radiusKm = {{ radius_km }};
  const clientToken = localStorage.getItem("traffic_client_token") || "";

  const incidentTypes = {
    accidente: { emoji: "🚗", label: "Accidente" },
    via_cerrada: { emoji: "⛔", label: "Vía cerrada" },
    inundacion: { emoji: "🌊", label: "Inundación" },
    semaforo: { emoji: "🚦", label: "Semáforo dañado" },
    obras: { emoji: "🚧", label: "Obras" },
    congestion: { emoji: "🐢", label: "Congestión" },
    alarma: { emoji: "🚨", label: "" },
    revision_oficial: { emoji: "🚨", label: "" }
  };

  const map = L.map("map").setView([userLat, userLng], 14);
  const incidentLayer = L.layerGroup().addTo(map);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: "&copy; OpenStreetMap contributors"
  }).addTo(map);

  const radiusCircle = L.circle([userLat, userLng], {
    radius: radiusKm * 1000,
    fillOpacity: 0.04
  }).addTo(map);

  L.circleMarker([userLat, userLng], { radius: 7 })
    .addTo(map)
    .bindPopup("Tu ubicación");

  function emojiIcon(emoji) {
    return L.divIcon({
      className: "emoji-marker",
      html: emoji,
      iconSize: [34, 34],
      iconAnchor: [17, 17],
      popupAnchor: [0, -18]
    });
  }

  async function loadIncidents(showAll) {
    incidentLayer.clearLayers();
    const url = new URL("/api/incidents/nearby", window.location.origin);
    url.searchParams.set("lat", userLat);
    url.searchParams.set("lng", userLng);
    url.searchParams.set("radius_km", radiusKm);
    if (showAll) url.searchParams.set("all_reports", "true");

    const response = await fetch(url, {
      headers: clientToken ? {"X-Client-Token": clientToken} : {}
    });
    if (!response.ok) throw new Error("HTTP " + response.status);
    const data = await response.json();

    const bounds = [];
    data.incidents.forEach(item => {
      const meta = incidentTypes[item.kind] || { emoji: "📍", label: item.kind.replaceAll("_", " ") };
      const ownerButton = item.owned_by_me
        ? `<button onclick="removeIncident(${item.id})">🗑 Eliminar mi reporte</button>`
        : "";
      const text = `
        <strong>${meta.emoji}${meta.label ? " " + meta.label : ""}</strong><br>
        ${item.description || "Sin descripción"}<br>
        ${item.distance_km} km · ${item.confirmations} confirmación(es)<br>
        Ya no está: ${item.gone_votes} · Incorrecto: ${item.incorrect_votes}<br><br>
        <button onclick="voteIncident(${item.id}, 'confirm')">✅ Confirmar</button>
        <button onclick="voteIncident(${item.id}, 'gone')">🟢 Ya no está</button>
        <button onclick="voteIncident(${item.id}, 'incorrect')">⚠️ Incorrecto</button>
        ${ownerButton}
      `;
      L.marker([item.lat, item.lng], { icon: emojiIcon(meta.emoji), incidentId: item.id })
        .addTo(incidentLayer)
        .bindPopup(text);
      bounds.push([item.lat, item.lng]);
    });

    document.getElementById("scopeText").textContent = showAll
      ? "Mostrando todos los reportes activos disponibles."
      : `Mostrando incidentes dentro de ${radiusKm} km.`;

    radiusCircle.setStyle({ opacity: showAll ? 0 : 1, fillOpacity: showAll ? 0 : 0.04 });

    if (showAll && bounds.length > 0) {
      bounds.push([userLat, userLng]);
      map.fitBounds(bounds, { padding: [28, 28], maxZoom: 15 });
    } else if (!showAll) {
      map.setView([userLat, userLng], 14);
    }
  }

  let currentShowAll = false;

  window.voteIncident = async function(id, action) {
    if (!clientToken) {
      alert("Abre el mapa desde la Mini App para participar.");
      return;
    }
    const response = await fetch(`/api/incidents/${id}/vote`, {
      method: "POST",
      headers: {"Content-Type": "application/json", "X-Client-Token": clientToken},
      body: JSON.stringify({action})
    });
    const data = await response.json();
    if (!response.ok) {
      alert(data.detail || "No se pudo registrar tu voto.");
      return;
    }
    map.closePopup();
    incidentLayer.eachLayer(layer => {
      if (layer.options && layer.options.incidentId === id) {
        incidentLayer.removeLayer(layer);
      }
    });
    await loadIncidents(currentShowAll);
  };

  window.removeIncident = async function(id) {
    if (!clientToken) return;
    if (!confirm("¿Eliminar tu reporte?")) return;
    const response = await fetch(`/api/incidents/${id}`, {
      method: "DELETE",
      headers: {"X-Client-Token": clientToken}
    });
    const data = await response.json();
    if (!response.ok) {
      alert(data.detail || "No se pudo eliminar.");
      return;
    }
    map.closePopup();
    await loadIncidents(currentShowAll);
  };

  document.getElementById("homeBtn").addEventListener("click", () => {
    window.location.href = "/mini-app";
  });

  document.getElementById("nearbyBtn").addEventListener("click", async () => {
    currentShowAll = false;
    document.getElementById("nearbyBtn").classList.add("active");
    document.getElementById("allBtn").classList.remove("active");
    try { await loadIncidents(false); } catch { alert("No se pudo cargar la actividad cercana."); }
  });

  document.getElementById("allBtn").addEventListener("click", async () => {
    currentShowAll = true;
    document.getElementById("allBtn").classList.add("active");
    document.getElementById("nearbyBtn").classList.remove("active");
    try { await loadIncidents(true); } catch { alert("No se pudieron cargar todos los reportes."); }
  });

  loadIncidents(false).catch(() => alert("No se pudo cargar la actividad cercana."));
</script>
</body>
</html>
