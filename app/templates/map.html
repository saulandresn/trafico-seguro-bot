<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Actividad vial cercana</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <style>
    html, body { margin: 0; font-family: system-ui, sans-serif; background: #f6f7f9; color: #111827; }
    header { padding: 14px 16px; background: white; border-bottom: 1px solid #e5e7eb; }
    header h1 { margin: 0 0 4px; font-size: 18px; }
    header p { margin: 0; color: #6b7280; font-size: 13px; }
    #map { height: 72vh; min-height: 420px; }
    .legend { padding: 12px 16px; font-size: 13px; }
  </style>
</head>
<body>
<header>
  <h1>Actividad vial cercana</h1>
  <p>Solo se muestran incidentes dentro de {{ radius_km }} km de la ubicación compartida.</p>
</header>
<div id="map"></div>
<div class="legend">Tipos: accidente · vía cerrada · inundación · semáforo · congestión · obras.</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
  const userLat = {{ lat }};
  const userLng = {{ lng }};
  const radiusKm = {{ radius_km }};
  const map = L.map('map').setView([userLat, userLng], 14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);
  L.circle([userLat, userLng], {radius: radiusKm * 1000, fillOpacity: 0.04}).addTo(map);
  L.circleMarker([userLat, userLng], {radius: 7}).addTo(map).bindPopup('Tu ubicación compartida');

  fetch(`/api/incidents/nearby?lat=${encodeURIComponent(userLat)}&lng=${encodeURIComponent(userLng)}&radius_km=${encodeURIComponent(radiusKm)}`)
    .then(r => r.json())
    .then(data => {
      data.incidents.forEach(item => {
        const text = `<strong>${item.kind.replace('_', ' ')}</strong><br>${item.description || 'Sin descripción'}<br>${item.distance_km} km · ${item.confirmations} confirmación(es)`;
        L.marker([item.lat, item.lng]).addTo(map).bindPopup(text);
      });
    })
    .catch(() => alert('No se pudo cargar la actividad cercana.'));
</script>
</body>
</html>
